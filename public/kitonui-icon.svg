<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>KitonUI</title>
  <desc>Four crisp, interlocking interface modules around a central spark.</desc>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="#101512"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="17.25" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="1.5"/>

  <!-- Four modular surfaces form one compact, interlocking mark. -->
  <path d="M18 13h8a3 3 0 0 1 3 3v8l-4 4h-9a3 3 0 0 1-3-3v-8a4 4 0 0 1 5-4Z" fill="#6EE7B7"/>
  <path d="M38 13h8a4 4 0 0 1 5 4v8a3 3 0 0 1-3 3h-9l-4-4v-8a3 3 0 0 1 3-3Z" fill="#34D399"/>
  <path d="M13 38a3 3 0 0 1 3-3h9l4 4v8a3 3 0 0 1-3 3h-8a4 4 0 0 1-5-4v-8Z" fill="#10B981"/>
  <path d="M35 39l4-4h9a3 3 0 0 1 3 3v8a4 4 0 0 1-5 4h-8a3 3 0 0 1-3-3v-8Z" fill="#059669"/>

  <!-- A small luminous center gives the modules a shared focal point. -->
  <path d="M32 25.5 34.6 29.4 38.5 32 34.6 34.6 32 38.5 29.4 34.6 25.5 32 29.4 29.4 32 25.5Z" fill="#ECFDF5"/>
</svg>
